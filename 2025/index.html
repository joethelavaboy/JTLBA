<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to JTLB - 2025 Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Geist", "Inter", sans-serif;
    color: #f8fafc;
    background-color: #02040a;
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.22) 0%, transparent 60%),
      radial-gradient(circle at 10% 90%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.12) 0%, transparent 50%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 80px;
  }

  /* --- 2025 Spatial Pill Navigation --- */
  nav {
    width: 90%;
    max-width: 1120px;
    margin: 24px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: rgba(10, 15, 30, 0.6);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(99, 102, 241, 0.1);
  }

  .JTLB { display: flex; align-items: center; gap: 12px; }

  .JTLB-mark {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #90d5ff 0%, #0800FF 50%, #030057 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
  }

  .menu { display: flex; gap: 24px; list-style: none; }
  .menu a {
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .menu a:hover { color: #f8fafc; }

  /* --- 2025 Bento Spatial Hero Card --- */
  .hero-card {
    width: 90%;
    max-width: 1120px;
    margin: 36px auto 0;
    background: rgba(10, 15, 30, 0.5);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    padding: 56px;
    display: grid;
    grid-template-columns: 1.35fr 0.65fr;
    gap: 48px;
    align-items: center;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .hero-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
  }

  .hero-card:hover {
    border-color: rgba(99, 102, 241, 0.35);
    box-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
  }

  /* 2025 Agentic Status Pill */
  .agent-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 9999px;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: #c084fc;
    font-size: 12px;
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    margin-bottom: 24px;
    width: fit-content;
  }

  .agent-pill .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #c084fc;
    box-shadow: 0 0 10px #c084fc;
  }

  .hero-text h1 {
    font-size: 60px;
    font-weight: 800;
    letter-spacing: -2.5px;
    color: #ffffff;
    line-height: 1.05;
    margin-bottom: 16px;
  }

  .hero-text p.sub {
    font-size: 18px;
    font-weight: 400;
    color: #94a3b8;
    line-height: 1.6;
    margin-bottom: 36px;
  }

  .buttons { display: flex; gap: 16px; flex-wrap: wrap; }

  .btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-block;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
  }

  .btn img {
    height: 46px;
    width: auto;
    display: block;
    filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.7));
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.02);
    filter: drop-shadow(0 10px 25px rgba(99, 102, 241, 0.45));
  }

  .btn:active { transform: translateY(0) scale(1); }

  /* Mobile Phone Frame */
  .hero-mockup {
    display: flex;
    justify-content: center;
  }

  .phone-frame {
    width: 240px;
    height: 480px;
    background: #010308;
    border-radius: 42px;
    padding: 8px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.95), 0 0 45px rgba(99, 102, 241, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.15);
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 34px;
    overflow: hidden;
  }

  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media (max-width: 850px) {
    .hero-card { grid-template-columns: 1fr; text-align: center; padding: 36px 24px; }
    .agent-pill { margin: 0 auto 20px; }
    .buttons { justify-content: center; }
    nav { flex-direction: column; gap: 16px; padding: 16px 20px; border-radius: 24px; }
    .hero-text h1 { font-size: 38px; }
  }
</style>
</head>
<body>

  <nav>
    <div class="JTLB">
      <div class="JTLB-mark">JTLB</div>
    </div>
    <ul class="menu">
      <li><a href="/JTLBA/2025/">Home</a></li>
      <li><a href="/JTLBA/2025/about/">About</a></li>
      <li><a href="/JTLBA/2025/services/">Services</a></li>
      <li><a href="/JTLBA/2025/blog/">Blog</a></li>
      <li><a href="/JTLBA/2025/contact/">Contact</a></li>
    </ul>
  </nav>

  <div class="hero-card">
    <div class="hero-text">
      <div>
      </div>
      <h1>JTLB App</h1>
      <p class="sub">Experience everything in the palm of your hand.</p>
      
      <div class="buttons">
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="Download on the App Store">
        </button>
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play">
        </button>
      </div>
    </div>

    <div class="hero-mockup">
      <div class="phone-frame">
        <div class="phone-screen">
          <img src="/JTLBA/2017/jtlbhero2017.png" alt="JTLB App on device">
        </div>
      </div>
    </div>
  </div>

</body>
</html>
