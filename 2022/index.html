<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JTLB</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: #f3f4f6;
    background-color: #05050a;
    background-image: 
      radial-gradient(circle at 30% -20%, rgba(139, 92, 246, 0.25) 0%, transparent 50%),
      radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 80px;
  }

  nav {
    width: 90%;
    max-width: 1120px;
    margin: 24px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: rgba(20, 20, 30, 0.7);
    backdrop-filter: blur(20px);
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .JTLB-mark {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #111184 0%, #3b82f6 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
  }

  .menu { display: flex; gap: 24px; list-style: none; }
  .menu a { color: #9ca3af; font-size: 14px; text-decoration: none; transition: color 0.2s; }
  .menu a.active, .menu a:hover { color: #ffffff; }

  .bento-grid {
    width: 90%;
    max-width: 1120px;
    margin: 40px auto 0;
    display: grid;
    grid-template-columns: 1.4fr 0.6fr;
    gap: 24px;
  }

  .bento-card {
    background: rgba(18, 18, 28, 0.65);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    padding: 52px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
  }

  .bento-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }

  .tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 9999px;
    background: rgba(139, 92, 246, 0.12);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: #c4b5fd;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    width: fit-content;
    margin-bottom: 24px;
  }

  .hero-text h1 { font-size: 58px; font-weight: 800; letter-spacing: -2px; color: #ffffff; line-height: 1.05; margin-bottom: 16px; }
  .hero-text p.sub { font-size: 18px; color: #9ca3af; margin-bottom: 36px; line-height: 1.6; }

  .buttons { display: flex; gap: 16px; flex-wrap: wrap; }
  .btn { background: none; border: none; cursor: pointer; }
  .btn img { height: 46px; width: auto; display: block; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
  .btn:hover { transform: translateY(-2px); }

  .mockup-card {
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: radial-gradient(circle at center, rgba(139, 92, 246, 0.15) 0%, rgba(18, 18, 28, 0.65) 100%);
  }

  .phone-frame {
    width: 240px;
    height: 480px;
    background: #020205;
    border-radius: 40px;
    padding: 8px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 40px rgba(139, 92, 246, 0.2);
    border: 3px solid rgba(255, 255, 255, 0.12);
  }

  .phone-screen { width: 100%; height: 100%; border-radius: 32px; overflow: hidden; }
  .phone-screen img { width: 100%; height: 100%; object-fit: cover; }

  @media (max-width: 850px) {
    .bento-grid { grid-template-columns: 1fr; }
    .bento-card { padding: 36px 24px; text-align: center; }
    .tag-pill { margin: 0 auto 20px; }
    .buttons { justify-content: center; }
  }
</style>
</head>
<body>
  <nav>
    <div class="JTLB"><div class="JTLB-mark">JTLB</div></div>
    <ul class="menu">
      <li><a href="/JTLBA/2022/" class="active">Home</a></li>
      <li><a href="/JTLBA/2022/about/">About</a></li>
      <li><a href="/JTLBA/2022/servies/">Services</a></li>
      <li><a href="/JTLBA/2022/blog/">Blog</a></li>
      <li><a href="/JTLBA/2022/contacts/">Contact</a></li>
    </ul>
  </nav>

  <div class="bento-grid">
    <div class="bento-card">
      <div class="hero-text">
        <h1>JTLB App</h1>
        <p class="sub">Experience everything in the palm of your hand.</p>
      </div>

      <div class="buttons">
        <button class="btn" type="button"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store"></button>
        <button class="btn" type="button"><img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play"></button>
      </div>
    </div>

    <div class="bento-card mockup-card">
      <div class="phone-frame">
        <div class="phone-screen">
          <img src="/JTLBA/2021/jtlbhero2021.png" alt="JTLB App Mockup">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
