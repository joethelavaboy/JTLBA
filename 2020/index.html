<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JTLB</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: #f8fafc;
    background-color: #0b0f19;
    /* 2020 Tech Grid & Ambient Spotlight Background */
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.25) 0%, transparent 50%),
      linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 32px 32px, 32px 32px;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 60px;
  }

  /* --- 2020 Frosted Glass Floating Nav --- */
  nav {
    width: 90%;
    max-width: 1100px;
    margin: 24px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  }

  .JTLB {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .JTLB-mark {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
  }

  .menu {
    display: flex;
    align-items: center;
    gap: 28px;
    list-style: none;
  }

  .menu a {
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .menu a:hover {
    color: #f8fafc;
  }

  /* --- Glassmorphism Main Card --- */
  .hero-card {
    width: 90%;
    max-width: 1100px;
    margin: 40px auto 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 32px;
    padding: 64px;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 56px;
    align-items: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
  }

  /* Tag Pill */
  .tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 9999px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: #a5b4fc;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .hero-text h1 {
    font-size: 58px;
    font-weight: 800;
    letter-spacing: -1.5px;
    color: #ffffff;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  .hero-text p.sub {
    font-size: 18px;
    font-weight: 400;
    color: #94a3b8;
    line-height: 1.6;
    margin-bottom: 36px;
  }

  /* --- Badges & Action Buttons --- */
  .buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-block;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
  }

  .btn img {
    height: 48px;
    width: auto;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.02);
    filter: drop-shadow(0 10px 24px rgba(99, 102, 241, 0.35));
  }

  .btn:active {
    transform: translateY(0) scale(1);
  }

  /* --- Glass Phone Showcase --- */
  .hero-mockup {
    display: flex;
    justify-content: center;
  }

  .phone-frame {
    width: 260px;
    height: 500px;
    background: #020617;
    border-radius: 44px;
    padding: 10px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.2);
    border: 3px solid rgba(255, 255, 255, 0.15);
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 34px;
    overflow: hidden;
  }

  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media (max-width: 850px) {
    .hero-card { grid-template-columns: 1fr; text-align: center; padding: 36px 24px; }
    .buttons { justify-content: center; }
    nav { flex-direction: column; gap: 16px; padding: 16px 20px; border-radius: 24px; }
    .hero-text h1 { font-size: 38px; }
    .phone-frame { width: 220px; height: 420px; }
  }
</style>
</head>
<body>

  <nav>
    <div class="JTLB">
      <div class="JTLB-mark">JTLB</div>
    </div>
    <ul class="menu">
      <li><a href="/JTLBA/2020/">Home</a></li>
      <li><a href="/JTLBA/2020/about/">About</a></li>
      <li><a href="/JTLBA/2020/services/">Services</a></li>
      <li><a href="/JTLBA/2020/blog/">Blog</a></li>
      <li><a href="/JTLBA/2020/contact/">Contact</a></li>
    </ul>
  </nav>

  <div class="hero-card">
    <div class="hero-text">
      <div>
      <h1>JTLB App</h1>
      <p class="sub">Experience everything in the palm of your hand.</p>
      
      <div class="buttons">
        <!-- App Store Badge Button -->
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="Download on the App Store">
        </button>
        
        <!-- Google Play / Android Badge Button -->
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play">
        </button>
      </div>
    </div>

    <div class="hero-mockup">
      <div class="phone-frame">
        <div class="phone-screen">
          <img src="/JTLBA/2017/jtlbhero2017.png">
        </div>
      </div>
    </div>
  </div>

</body>
</html>
