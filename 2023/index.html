<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to JTLB - 2023 Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: #f3f4f6;
    background-color: #080a0f;
    background-image: 
      radial-gradient(circle at 50% -10%, rgba(124, 58, 237, 0.22) 0%, transparent 60%),
      radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.12) 0%, transparent 50%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 80px;
  }

  /* --- 2023 Floating Glass Nav --- */
  nav {
    width: 90%;
    max-width: 1100px;
    margin: 24px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: rgba(15, 20, 30, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  }

  .JTLB { display: flex; align-items: center; gap: 12px; }

  .JTLB-mark {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
  }

  .menu { display: flex; gap: 24px; list-style: none; }
  .menu a {
    color: #9ca3af;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .menu a:hover { color: #ffffff; }

  /* --- Main 2023 Aura Card Container --- */
  .hero-card {
    width: 90%;
    max-width: 1100px;
    margin: 40px auto 0;
    background: rgba(15, 20, 32, 0.65);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    padding: 56px;
    display: grid;
    grid-template-columns: 1.25fr 0.75fr;
    gap: 48px;
    align-items: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    position: relative;
    overflow: hidden;
  }

  .hero-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  }

  /* 2023 AI Meta Badge */
  .ai-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 9999px;
    background: rgba(124, 58, 237, 0.12);
    border: 1px solid rgba(124, 58, 237, 0.3);
    color: #ddd6fe;
    font-size: 12px;
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    margin-bottom: 24px;
    width: fit-content;
  }

  .hero-text h1 {
    font-size: 58px;
    font-weight: 800;
    letter-spacing: -2px;
    color: #ffffff;
    line-height: 1.05;
    margin-bottom: 16px;
  }

  .hero-text p.sub {
    font-size: 18px;
    font-weight: 400;
    color: #9ca3af;
    line-height: 1.6;
    margin-bottom: 36px;
  }

  .buttons { display: flex; gap: 16px; flex-wrap: wrap; }

  .btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-block;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
  }

  .btn img {
    height: 46px;
    width: auto;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.02);
    filter: drop-shadow(0 10px 24px rgba(124, 58, 237, 0.35));
  }

  .btn:active { transform: translateY(0) scale(1); }

  /* Phone Mockup Frame */
  .hero-mockup {
    display: flex;
    justify-content: center;
  }

  .phone-frame {
    width: 250px;
    height: 490px;
    background: #020408;
    border-radius: 42px;
    padding: 8px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(124, 58, 237, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.12);
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 34px;
    overflow: hidden;
  }

  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media (max-width: 850px) {
    .hero-card { grid-template-columns: 1fr; text-align: center; padding: 36px 24px; }
    .ai-badge { margin: 0 auto 20px; }
    .buttons { justify-content: center; }
    nav { flex-direction: column; gap: 16px; padding: 16px 20px; border-radius: 24px; }
    .hero-text h1 { font-size: 38px; }
  }
</style>
</head>
<body>

  <nav>
    <div class="JTLB">
      <div class="JTLB-mark">JTLB</div>
    </div>
    <ul class="menu">
      <li><a href="/JTLBA/2023/">Home</a></li>
      <li><a href="/JTLBA/2023/about/">About</a></li>
      <li><a href="/JTLBA/2023/services/">Services</a></li>
      <li><a href="/JTLBA/2023/blog/">Blog</a></li>
      <li><a href="/JTLBA/2023/contact/">Contact</a></li>
    </ul>
  </nav>

  <div class="hero-card">
    <div class="hero-text">
      </div>
      <h1>JTLB App</h1>
      <p class="sub">Experience everything in the palm of your hand.</p>
      
      <div class="buttons">
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="Download on the App Store">
        </button>
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play">
        </button>
      </div>
    </div>

    <div class="hero-mockup">
      <div class="phone-frame">
        <div class="phone-screen">
          <img src="/JTLBA/2017/jtlbhero2017.png" alt="JTLB App Mockup">
        </div>
      </div>
    </div>
</body>
</html>
