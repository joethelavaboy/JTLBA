<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JTLB</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1e293b;
    background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 60px;
  }

  /* --- 2018 Frosted Pill Navigation --- */
  nav {
    width: 90%;
    max-width: 1040px;
    margin: 24px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
  }

  .JTLB {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .JTLB-mark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
background: linear-gradient(312deg,rgba(0, 119, 255, 1) 0%, rgba(8, 0, 255, 1) 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
  }

  .menu {
    display: flex;
    align-items: center;
    gap: 24px;
    list-style: none;
  }

  .menu a {
    color: #64748b;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .menu a:hover {
    color: #4f46e5;
  }

  /* --- Main Floating Hero Container --- */
  .hero-card {
    width: 90%;
    max-width: 1040px;
    margin: 40px auto 0;
    background: #ffffff;
    border-radius: 28px;
    padding: 56px;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 48px;
    align-items: center;
    box-shadow: 0 20px 50px -10px rgba(15, 23, 42, 0.08);
  }

  .hero-text h1 {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -1.5px;
    color: #0f172a;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  .hero-text p.sub {
    font-size: 18px;
    font-weight: 400;
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 36px;
  }

  /* --- Badges & Action Buttons --- */
  .buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-block;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
  }

  .btn img {
    height: 48px;
    width: auto;
    display: block;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.06));
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.02);
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.12));
  }

  .btn:active {
    transform: translateY(0) scale(1);
  }

  /* --- Mobile Mockup --- */
  .hero-mockup {
    display: flex;
    justify-content: center;
  }

  .phone-frame {
    width: 260px;
    height: 500px;
    background: #0f172a;
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 25px 40px -15px rgba(0, 0, 0, 0.25);
    border: 4px solid #f8fafc;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 30px;
    overflow: hidden;
  }

  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media (max-width: 850px) {
    .hero-card { grid-template-columns: 1fr; text-align: center; padding: 32px 24px; }
    .buttons { justify-content: center; }
    nav { flex-direction: column; gap: 16px; padding: 16px 20px; border-radius: 20px; }
    .hero-text h1 { font-size: 36px; }
    .phone-frame { width: 220px; height: 420px; }
  }
</style>
</head>
<body>

  <nav>
    <div class="JTLB">
      <div class="JTLB-mark">JTLB</div>
    </div>
    <ul class="menu">
      <li><a href="/JTLBA/2017/">Home</a></li>
      <li><a href="/JTLBA/2017/about/">About</a></li>
      <li><a href="/JTLBA/2017/services/">Services</a></li>
      <li><a href="/JTLBA/2017/blog/">Blog</a></li>
      <li><a href="/JTLBA/2017/contact/">Contact</a></li>
    </ul>
  </nav>

  <div class="hero-card">
    <div class="hero-text">
      <h1>JTLB App</h1>
      <p class="sub">Experience everything in the palm of your hand.</p>
      
      <div class="buttons">
        <!-- App Store Badge Button -->
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="Download on the App Store">
        </button>
        
        <!-- Google Play / Android Badge Button -->
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/archive/7/78/20190802123605%21Google_Play_Store_badge_EN.svg" alt="Get it on Google Play">
        </button>
      </div>
    </div>

    <div class="hero-mockup">
      <div class="phone-frame">
        <div class="phone-screen">
          <img src="/JTLBA/2017/jtlbhero2017.png" alt="JTLB App Screenshot">
        </div>
      </div>
    </div>
  </div>

</body>
</html>
