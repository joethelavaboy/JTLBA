<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to JTLB - 2012 Metro Edition</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", "Open Sans", Arial, sans-serif;
    color: #ffffff;
    background-color: #002035;
    background-image: radial-gradient(circle at 50% 30%, #003a5c 0%, #001524 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- 2012 Metro Top Navigation --- */
  nav {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background-color: #00121e;
    border-bottom: 2px solid #00a4ef;
  }

  .JTLB {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .JTLB-mark {
    width: 48px;
    height: 48px;
    background-color: #00a4ef;
    color: #ffffff;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .menu {
    display: flex;
    gap: 24px;
    list-style: none;
  }

  .menu a {
    display: inline-block;
    color: #a0c0d8;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: color 0.15s ease;
  }

  .menu a:hover {
    color: #00a4ef;
  }

  /* --- Header Area --- */
  header {
    text-align: center;
    max-width: 760px;
    margin: 50px 20px 30px;
  }

  h1 {
    font-size: 56px;
    font-weight: 200;
    letter-spacing: -1px;
    color: #ffffff;
    margin-bottom: 12px;
  }

  .sub {
    font-size: 18px;
    font-weight: 300;
    color: #729ebf;
  }

  /* --- 2012 Feature Display Frame --- */
  .app-preview {
    margin: 20px 0 35px;
    max-width: 600px;
    width: 90%;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .app-preview img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* --- Metro Image Badge Buttons --- */
  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
    max-width: 600px;
    padding: 0 20px 50px;
  }

  .btn {
    background-color: #00a4ef;
    border: none;
    padding: 8px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    transition: background-color 0.15s ease, transform 0.1s ease;
  }

  .btn img {
    height: 40px;
    width: auto;
    display: block;
  }

  .btn-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    color: #ffffff;
    text-transform: uppercase;
  }

  .btn-small {
    font-size: 9px;
    letter-spacing: 1px;
    opacity: 0.85;
  }

  .btn-large {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .btn:hover {
    background-color: #008be3;
  }

  .btn:active {
    transform: scale(0.98);
  }

  /* Android / Green Tile Accent */
  .btn.green {
    background-color: #7fba00;
  }

  .btn.green:hover {
    background-color: #70a400;
  }

  @media (max-width: 600px) {
    nav { flex-direction: column; gap: 16px; padding: 16px; }
    .menu { flex-wrap: wrap; justify-content: center; gap: 16px; }
    h1 { font-size: 40px; }
  }
</style>
</head>
<body>

  <nav>
    <div class="JTLB">
      <div class="JTLB-mark">JTLB</div>
    </div>
    <ul class="menu">
      <li><a href="/JTLBA/2012/">Home</a></li>
      <li><a href="/JTLBA/2012/about/">About</a></li>
      <li><a href="/JTLBA/2012/services/">Services</a></li>
      <li><a href="/JTLBA/2012/blog/">Blog</a></li>
      <li><a href="/JTLBA/2012/contact/">Contact</a></li>
    </ul>
  </nav>

  <header>
    <h1>JTLB App</h1>
    <p class="sub">Experience everything in the palm of your hand.</p>
  </header>

  <div class="buttons">
    <!-- App Store Badge Button -->
    <button class="btn" type="button">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/5d/Available_on_the_App_Store_%28black%29.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="App Store Icon">
    </button>
    
    <!-- Google Play / Android Badge Button -->
    <button class="btn green" type="button">
      <img src="https://static.wikia.nocookie.net/logopedia/images/9/93/Droidmarkblackshort.svg/revision/latest?cb=20251023180326" alt="Google Play Icon">
    </button>
  </div>

</body>
</html>
