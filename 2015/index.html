<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to JTLB - 2015 Edition</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #ffffff;
    background-color: #0f1419;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- 2015 Hero Background Section --- */
  .hero-section {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    /* Hero image background with dark tint overlay */
    background: linear-gradient(180deg, rgba(15, 20, 25, 0.7) 0%, rgba(15, 20, 25, 0.9) 100%),
                url("/JTLBA/2015/jtlbhero2015.png") center/cover no-repeat fixed;
  }

  /* --- Top Navigation --- */
  nav {
    width: 100%;
    max-width: 1100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 32px;
  }

  .JTLB {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .JTLB-mark {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: #0066ff;
    color: #ffffff;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(0, 102, 255, 0.4);
  }

  .menu {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .menu a {
    display: inline-block;
    color: rgba(255, 255, 255, 0.8);
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .menu a:hover {
    color: #ffffff;
  }

  /* --- Hero Content Area --- */
  header {
    text-align: center;
    max-width: 780px;
    margin: 80px 20px 40px;
    padding: 0 20px;
  }

  h1 {
    font-size: 60px;
    font-weight: 800;
    letter-spacing: -1.5px;
    color: #ffffff;
    margin-bottom: 20px;
    line-height: 1.1;
  }

  .sub {
    font-size: 22px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.5;
  }

  /* --- 2015 Floating Card CTA Block --- */
  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    margin-bottom: 60px;
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-block;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .btn img {
    height: 48px;
    width: auto;
    display: block;
  }

  .btn:hover {
    opacity: 0.9;
    transform: translateY(-2px);
  }

  .btn:active {
    transform: translateY(0);
  }

  @media (max-width: 600px) {
    nav { flex-direction: column; gap: 20px; padding: 20px; }
    .menu { flex-wrap: wrap; justify-content: center; gap: 18px; }
    h1 { font-size: 38px; }
    .sub { font-size: 18px; }
    header { margin-top: 40px; }
  }
</style>
</head>
<body>

  <div class="hero-section">
    <nav>
      <div class="JTLB">
        <div class="JTLB-mark">JTLB</div>
      </div>
      <ul class="menu">
        <li><a href="/JTLBA/2015/">Home</a></li>
        <li><a href="/JTLBA/2015/about/">About</a></li>
        <li><a href="/JTLBA/2015/services/">Services</a></li>
        <li><a href="/JTLBA/2015/blog/">Blog</a></li>
        <li><a href="/JTLBA/2015/contact/">Contact</a></li>
      </ul>
    </nav>

    <header>
      <h1>JTLB App</h1>
      <p class="sub">Experience everything in the palm of your hand.</p>
    </header>

    <div class="card">
      <div class="buttons">
        <!-- App Store Badge Button -->
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/archive/3/3c/20170219160110%21Download_on_the_App_Store_Badge.svg" alt="Download on the App Store">
        </button>
        
        <!-- Google Play / Android Badge Button -->
        <button class="btn" type="button">
          <img src="https://static.wikia.nocookie.net/logopedia/images/a/a7/En-play-badge.png/revision/latest?cb=2010113131659" alt="Get it on Google Play">
        </button>
      </div>
    </div>
  </div>

</body>
</html>
