<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JTLB</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #f0f6fc;
    background-color: #0d1117;
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(14, 165, 233, 0.1) 0%, transparent 40%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 60px;
  }

  /* --- 2019 Dark Mode Floating Pill Navigation --- */
  nav {
    width: 90%;
    max-width: 1100px;
    margin: 28px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: rgba(22, 27, 34, 0.8);
    backdrop-filter: blur(12px);
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .JTLB {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .JTLB-mark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #111184 0%, #0ea5e9 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
  }

  .menu {
    display: flex;
    align-items: center;
    gap: 28px;
    list-style: none;
  }

  .menu a {
    color: #8b949e;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .menu a:hover {
    color: #f0f6fc;
  }

  /* --- Main Dark Mode Hero Card --- */
  .hero-card {
    width: 90%;
    max-width: 1100px;
    margin: 48px auto 0;
    background: #161b22;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 28px;
    padding: 60px;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 56px;
    align-items: center;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
  }

  .hero-text h1 {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -1.5px;
    color: #ffffff;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  .hero-text p.sub {
    font-size: 18px;
    font-weight: 400;
    color: #8b949e;
    line-height: 1.6;
    margin-bottom: 36px;
  }

  /* --- Badges & Action Buttons --- */
  .buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-block;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
  }

  .btn img {
    height: 48px;
    width: auto;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.02);
    filter: drop-shadow(0 8px 20px rgba(99, 102, 241, 0.3));
  }

  .btn:active {
    transform: translateY(0) scale(1);
  }

  /* --- Mobile Mockup --- */
  .hero-mockup {
    display: flex;
    justify-content: center;
  }

  .phone-frame {
    width: 260px;
    height: 500px;
    background: #010409;
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    border: 3px solid #30363d;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 30px;
    overflow: hidden;
  }

  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media (max-width: 850px) {
    .hero-card { grid-template-columns: 1fr; text-align: center; padding: 36px 24px; }
    .buttons { justify-content: center; }
    nav { flex-direction: column; gap: 16px; padding: 16px 20px; border-radius: 20px; }
    .hero-text h1 { font-size: 38px; }
    .phone-frame { width: 220px; height: 420px; }
  }
</style>
</head>
<body>

  <nav>
    <div class="JTLB">
      <div class="JTLB-mark">JTLB</div>
    </div>
    <ul class="menu">
      <li><a href="/JTLBA/2019/">Home</a></li>
      <li><a href="/JTLBA/2019/about/">About</a></li>
      <li><a href="/JTLBA/2019/services/">Services</a></li>
      <li><a href="/JTLBA/2019/blog/">Blog</a></li>
      <li><a href="/JTLBA/2019/contact/">Contact</a></li>
    </ul>
  </nav>

  <div class="hero-card">
    <div class="hero-text">
      <h1>JTLB App</h1>
      <p class="sub">Experience everything in the palm of your hand.</p>
      
      <div class="buttons">
        <!-- App Store Badge Button -->
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="Download on the App Store">
        </button>
        
        <!-- Google Play / Android Badge Button -->
        <button class="btn" type="button">
          <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play">
        </button>
      </div>
    </div>

    <div class="hero-mockup">
      <div class="phone-frame">
        <div class="phone-screen">
          <img src="/JTLBA/2017/jtlbhero2017.png" alt="JTLB App Screenshot">
        </div>
      </div>
    </div>
  </div>

</body>
</html>
