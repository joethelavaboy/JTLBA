<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JTLB</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f1f5f9;
    background-color: #030712;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 80px;
  }

  nav {
    width: 90%;
    max-width: 1100px;
    margin: 28px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(16px);
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .JTLB-mark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
  }

  .menu { display: flex; gap: 28px; list-style: none; }
  .menu a { color: #94a3b8; font-size: 14px; text-decoration: none; transition: color 0.2s; }
  .menu a:hover { color: #06b6d4; }

  .hero-card {
    width: 90%;
    max-width: 1100px;
    margin: 48px auto 0;
    background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    padding: 60px;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 56px;
    align-items: center;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 9999px;
    background: rgba(6, 182, 212, 0.1);
    border: 1px solid rgba(6, 182, 212, 0.3);
    color: #22d3ee;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .hero-text h1 { font-size: 56px; font-weight: 800; letter-spacing: -1.5px; color: #ffffff; margin-bottom: 20px; }
  .hero-text p.sub { font-size: 18px; color: #94a3b8; margin-bottom: 36px; line-height: 1.6; }

  .buttons { display: flex; gap: 16px; flex-wrap: wrap; }
  .btn { background: none; border: none; cursor: pointer; }
  .btn img { height: 48px; width: auto; display: block; filter: drop-shadow(0 4px 15px rgba(0,0,0,0.5)); }
  .btn:hover { transform: translateY(-2px); }

  .phone-frame {
    width: 260px;
    height: 500px;
    background: #020617;
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 30px rgba(6, 182, 212, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.15);
  }

  .phone-screen { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; }
  .phone-screen img { width: 100%; height: 100%; object-fit: cover; }

  @media (max-width: 850px) {
    .hero-card { grid-template-columns: 1fr; text-align: center; padding: 36px 24px; }
    .buttons { justify-content: center; }
  }
</style>
</head>
<body>
  <nav>
    <div class="JTLB"><div class="JTLB-mark">JTLB</div></div>
    <ul class="menu">
      <li><a href="/JTLBA/2021/">Home</a></li>
      <li><a href="/JTLBA/2021/about/">About</a></li>
      <li><a href="/JTLBA/2021/services/">Services</a></li>
      <li><a href="/JTLBA/2021/blog/">Blog</a></li>
      <li><a href="/JTLBA/2021/contact/">Contact</a></li>
    </ul>
  </nav>

  <div class="hero-card">
    <div class="hero-text">
      <h1>JTLB App</h1>
      <p class="sub">Experience everything in the palm of your hand.</p>
      <div class="buttons">
        <button class="btn" type="button"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store"></button>
        <button class="btn" type="button"><img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play"></button>
      </div>
    </div>

    <div class="hero-mockup">
      <div class="phone-frame">
        <div class="phone-screen">
          <img src="/JTLBA/2021/jtlbhero2021.png">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
